<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1140" viewBox="0 0 1200 1140" role="img" aria-labelledby="title desc">
<title id="title">Eventmaxxer — a layered campaign architecture</title>
<desc id="desc">Each campaign has four layers: intent, execution, recommendations and human decisions. Goals guide discovery, qualification, application and verification into a campaign tracker. The tracker and goal feed evidence-backed recommendations and a shortlist. Attendance feedback returns to the tracker to inform future recommendations. Private profile facts and a cooldown gate support every campaign.</desc>
