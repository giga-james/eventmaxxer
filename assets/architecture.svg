<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="960" viewBox="0 0 1120 960" role="img" aria-labelledby="title desc">
<title id="title">Eventmaxxer: each campaign has a tracker and recommendations</title>
<desc id="desc">A campaign defines its goal, audience, dates and constraints. The agent discovers, qualifies, applies and verifies events into that campaign's tracker. Recommendations use the tracker and networking goal to create an evidence-backed attendance shortlist. The user decides and gives feedback. Reusable profile facts and private state support campaigns; a cooldown gate coordinates retries.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#172b40}.title{font-family:Georgia,serif;font-size:28px}.label{font-size:17px;font-weight:600}.detail{font-size:14px;fill:#52667c}.kicker{font-size:12px;font-weight:700;letter-spacing:1.3px;fill:#61748a}.edge{fill:none;stroke:#64748b;stroke-width:1.5;marker-end:url(#arrow)}</style>
<rect width="1120" height="960" rx="12" fill="white"/>
<text x="40" y="45" class="title">Eventmaxxer: from broad options to the right conversations</text>
<text x="40" y="73" class="detail">Each campaign owns its goal, tracker and recommendations. You choose what to attend.</text>
<path d="M40 92H1080" stroke="#dce3ea"/>
<rect x="40" y="115" width="1040" height="610" rx="12" fill="#f5f7fc" stroke="#dbe2ef"/>
<text x="60" y="143" class="kicker">ONE CAMPAIGN / GOAL + SCOPE + TRACKER + RECOMMENDATIONS</text>
<rect x="60" y="165" width="460" height="100" rx="7" fill="#fffaf0" stroke="#d7c298"/>
<text x="78" y="194" class="label">Define the campaign</text>
<text x="78" y="220" class="detail">People to meet + desired outcome</text>
<text x="78" y="241" class="detail">Dates, location, capacity + application permission</text>
<rect x="600" y="165" width="460" height="100" rx="7" fill="#fff" stroke="#aabbd5"/>
<text x="618" y="194" class="label">Ask, learn and re-review</text>
<text x="618" y="220" class="detail">Ask for missing facts; save confirmed reusable answers</text>
<text x="618" y="241" class="detail">Update the profile, then recheck event eligibility</text>
<text x="60" y="306" class="kicker">01 / BUILD OPTIONS</text>
<rect x="60" y="325" width="235" height="85" rx="7" fill="#fff" stroke="#aabbd5"/>
<text x="78" y="354" class="label">Discover</text>
<text x="78" y="380" class="detail">Search + scan</text>
<rect x="315" y="325" width="235" height="85" rx="7" fill="#fff" stroke="#aabbd5"/>
<text x="333" y="354" class="label">Qualify</text>
<text x="333" y="380" class="detail">Fit + eligibility</text>
<rect x="570" y="325" width="235" height="85" rx="7" fill="#fff" stroke="#aabbd5"/>
<text x="588" y="354" class="label">Apply</text>
<text x="588" y="380" class="detail">Fill + submit</text>
<rect x="825" y="325" width="235" height="85" rx="7" fill="#fff" stroke="#aabbd5"/>
<text x="843" y="354" class="label">Verify</text>
<text x="843" y="380" class="detail">Observe actual outcome</text>
<path class="edge" d="M290 265V325"/>
<path class="edge" d="M295 367H315"/>
<path class="edge" d="M550 367H570"/>
<path class="edge" d="M805 367H825"/>
<path class="edge" d="M432 325V286H830V265"/>
<rect x="60" y="460" width="310" height="110" rx="7" fill="#fff" stroke="#aabbd5"/>
<text x="78" y="489" class="label">Campaign tracker</text>
<text x="78" y="515" class="detail">Events + registration status</text>
<text x="78" y="536" class="detail">Your decisions + attendance notes</text>
<text x="78" y="557" class="detail">One source of truth for this campaign</text>
<rect x="410" y="460" width="310" height="110" rx="7" fill="#fff" stroke="#aabbd5"/>
<text x="428" y="489" class="label">Recommendation layer</text>
<text x="428" y="515" class="detail">Target people + conversation access</text>
<text x="428" y="536" class="detail">Evidence, confidence + known conflicts</text>
<text x="428" y="557" class="detail">Rank options within your capacity</text>
<rect x="760" y="460" width="300" height="110" rx="7" fill="#fff" stroke="#aabbd5"/>
<text x="778" y="489" class="label">Attendance shortlist</text>
<text x="778" y="515" class="detail">Strongest admitted options</text>
<text x="778" y="536" class="detail">Conditional backups shown separately</text>
<text x="778" y="557" class="detail">Who to seek + what to ask</text>
<path class="edge" d="M942 410V422H350V450H215V460"/>
<path class="edge" d="M370 515H410"/>
<path class="edge" d="M720 515H760"/>
<text x="60" y="444" class="kicker">02 / PRIORITIZE YOUR TIME</text>
<rect x="410" y="620" width="650" height="80" rx="7" fill="#fffaf0" stroke="#d7c298"/>
<text x="428" y="649" class="label">You decide, attend and give feedback</text>
<text x="428" y="675" class="detail">Useful conversations and follow-ups refine the next recommendation</text>
<path class="edge" d="M910 570V620"/>
<path class="edge" d="M410 659H215V570"/>
<text x="60" y="752" class="kicker">SHARED SUPPORT / PRIVATE STATE + RECOVERY</text>
<rect x="60" y="775" width="470" height="105" rx="7" fill="#fff" stroke="#aabbd5"/>
<text x="78" y="804" class="label">Reusable profile + private state</text>
<text x="78" y="830" class="detail">Confirmed facts, canonical event keys and reservations</text>
<text x="78" y="851" class="detail">Campaign-specific outcomes and assessments</text>
<text x="78" y="872" class="detail">Personal data stays outside the repository</text>
<rect x="590" y="775" width="470" height="105" rx="7" fill="#fff" stroke="#aabbd5"/>
<text x="608" y="804" class="label">Cooldown gate</text>
<text x="608" y="830" class="detail">Rate limited → save deadline → one due retry</text>
<text x="608" y="851" class="detail">One scheduler per account; preserve existing campaigns</text>
<text x="608" y="872" class="detail">Recommendations do not submit or cancel applications</text>
<path d="M40 905H1080" stroke="#dce3ea"/><text x="60" y="932" class="detail">Repeat this campaign structure for a different goal or event season, reusing appropriate profile facts.</text></svg>