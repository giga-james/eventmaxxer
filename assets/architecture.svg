<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1120" height="790" viewBox="0 0 1120 790" role="img" aria-labelledby="title desc">
<title id="title">Eventmaxxer architecture and user feedback loop</title>
<desc id="desc">The user sets scope and permission. The agent discovers, qualifies, applies, and verifies events. Missing facts prompt the user; the agent updates the profile with confirmed reusable facts and reviews the event again. Private state stores reservations and outcomes. The local cooldown gate wakes the agent for one retry when due.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
<g id="robot" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="2" y="5" width="18" height="14" rx="3"/><path d="M11 1v4M0 10v5M22 10v5M7 15h8"/><circle cx="7" cy="10" r="1"/><circle cx="15" cy="10" r="1"/></g>
<g id="person" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="6" r="4"/><path d="M3 21v-3a8 8 0 0 1 16 0v3"/></g>
<g id="local" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2" y="3" width="18" height="17" rx="2"/><path d="m6 8 4 4-4 4m7 0h4"/></g>
</defs>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#172b40}
.title{font-family:Georgia,'Times New Roman',serif;font-size:28px}
.kicker{font-size:12px;font-weight:700;letter-spacing:1.5px;fill:#61748a}
.label{font-size:16px;font-weight:600}
.detail{font-size:14px;fill:#52667c}
.edge{fill:none;stroke:#64748b;stroke-width:1.5;marker-end:url(#arrow)}
.dashed{stroke-dasharray:5 5}
.note{font-size:13px;fill:#52667c}
</style>
<rect width="1120" height="790" rx="12" fill="#fff"/>
<text x="40" y="46" class="title">Eventmaxxer: applications with a human feedback loop</text>
<text x="40" y="73" class="detail">The agent handles execution. You supply intent and missing facts.</text>
<path d="M40 91H1080" stroke="#dce3ea"/>
<text x="60" y="120" class="kicker">01 / USER INPUT + PROFILE LEARNING</text>
<rect x="40" y="320" width="1040" height="177" rx="8" fill="#f5f7fc" stroke="#dbe2ef"/>

<text x="60" y="479" class="kicker">02 / AGENT CONTROL</text>
<text x="60" y="613" class="kicker">03 / LOCAL STATE + RECOVERY</text>

<rect x="60" y="140" width="205" height="82" rx="6" fill="#fffaf0" stroke="#d7c298" stroke-width="1.4"/>
<use xlink:href="#person" x="76" y="157" color="#47648a"/>
<text x="108" y="175" class="label">Set the goal</text><text x="76" y="202" class="detail">Scope + permission</text>
<rect x="590" y="140" width="205" height="82" rx="6" fill="#fffaf0" stroke="#d7c298" stroke-width="1.4"/>
<use xlink:href="#person" x="606" y="157" color="#47648a"/>
<text x="638" y="175" class="label">Answer questions</text><text x="606" y="202" class="detail">Confirm missing facts</text>
<rect x="855" y="140" width="205" height="82" rx="6" fill="#fff" stroke="#aabbd5" stroke-width="1.4"/>
<use xlink:href="#robot" x="871" y="157" color="#47648a"/>
<text x="903" y="175" class="label">Update profile</text><text x="871" y="202" class="detail">Save reusable facts</text>
<rect x="60" y="365" width="205" height="82" rx="6" fill="#fff" stroke="#aabbd5" stroke-width="1.4"/>
<use xlink:href="#robot" x="76" y="382" color="#47648a"/>
<text x="108" y="400" class="label">Discover</text><text x="76" y="427" class="detail">Search + scan</text>
<rect x="325" y="365" width="205" height="82" rx="6" fill="#fff" stroke="#aabbd5" stroke-width="1.4"/>
<use xlink:href="#robot" x="341" y="382" color="#47648a"/>
<text x="373" y="400" class="label">Qualify</text><text x="341" y="427" class="detail">Fit + eligibility</text>
<rect x="590" y="365" width="205" height="82" rx="6" fill="#fff" stroke="#aabbd5" stroke-width="1.4"/>
<use xlink:href="#robot" x="606" y="382" color="#47648a"/>
<text x="638" y="400" class="label">Apply</text><text x="606" y="427" class="detail">Fill + submit</text>
<rect x="855" y="365" width="205" height="82" rx="6" fill="#fff" stroke="#aabbd5" stroke-width="1.4"/>
<use xlink:href="#robot" x="871" y="382" color="#47648a"/>
<text x="903" y="400" class="label">Verify &amp; track</text><text x="871" y="427" class="detail">Spreadsheet for review</text>
