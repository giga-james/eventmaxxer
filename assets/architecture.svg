<rect x="599.0" y="533" width="92" height="24" fill="#fff"/><text x="645" y="549" text-anchor="middle" class="note">Rate limited</text>
<path class="edge" d="M765 633V447"/>
<rect x="715.0" y="533" width="100" height="24" fill="#fff"/><text x="765" y="549" text-anchor="middle" class="note">One due retry</text>
