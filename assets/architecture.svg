<path class="edge" d="M795 181H855"/>
<path class="edge" d="M958 222V278H490V365"/>
<rect x="617.5" y="262" width="205" height="24" fill="#fff"/><text x="720" y="278" text-anchor="middle" class="note">Re-review with updated profile</text>
<path class="edge" d="M265 406H325"/>
<path class="edge" d="M530 406H590"/>
<path class="edge" d="M795 406H855"/>
<path class="edge" d="M1035 365V343H530V365"/>
<rect x="712.0" y="327" width="86" height="24" fill="#f5f7fc"/><text x="755" y="343" text-anchor="middle" class="note">Next event</text>
<rect x="60" y="633" width="470" height="82" rx="6" fill="#f4f9f7" stroke="#a7c6b9" stroke-width="1.4"/>
<use xlink:href="#local" x="76" y="650" color="#47648a"/>
<text x="108" y="668" class="label">Private state</text><text x="76" y="695" class="detail">Profile · deduplication · reservations · outcomes</text>
<rect x="590" y="633" width="470" height="82" rx="6" fill="#f4f9f7" stroke="#a7c6b9" stroke-width="1.4"/>
<use xlink:href="#local" x="606" y="650" color="#47648a"/>
<text x="638" y="668" class="label">Cooldown gate</text><text x="606" y="695" class="detail">Wait locally → wake agent → recheck submission gate</text>
<path class="edge dashed" d="M380 447V633"/>
<rect x="322.0" y="533" width="116" height="24" fill="#fff"/><text x="380" y="549" text-anchor="middle" class="note">Check + reserve</text>
<path class="edge dashed" d="M1015 447V572H1080V732H490V715"/>
